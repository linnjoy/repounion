[package]
name = "repounion"
version = "0.1.0"
edition = "2021"
description = "RepoUnion 多仓库 Git 状态看板"
publish = false

[lib]
name = "repounion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
repounion-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
