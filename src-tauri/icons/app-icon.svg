<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024" fill="none">
  <!-- RepoUnion「Union Node」应用图标源文件（视觉规范 4.2）。
       修改后在仓库根执行 `npx tauri icon src-tauri/icons/app-icon.svg` 重新生成全部尺寸。
       不画背景网格和辅助虚线，路径按小尺寸加粗，保证 16px / 32px 任务栏下依然清晰。 -->
  <defs>
    <linearGradient id="chassis" x1="16" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="rim" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#323846"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="forge" cx="64" cy="64" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#F97316" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="branch" x1="32" y1="96" x2="96" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="core" x1="50" y1="50" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="38%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#chassis)" stroke="url(#rim)" stroke-width="2.2"/>
  <circle cx="64" cy="64" r="46" fill="url(#forge)"/>
  <path d="M36 92V68C36 53 47 46 60 54L64 57" stroke="url(#branch)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 36V60C92 75 81 82 68 74L64 71" stroke="url(#branch)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="92" r="8.5" fill="#12151C" stroke="#F8FAFC" stroke-width="4.5"/>
  <circle cx="92" cy="36" r="8.5" fill="#12151C" stroke="#F8FAFC" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="21" fill="#12151C" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="13" fill="url(#core)"/>
  <ellipse cx="60.5" cy="59.5" rx="4" ry="2.4" transform="rotate(-32 60.5 59.5)" fill="#FFFFFF" opacity="0.65"/>
</svg>
