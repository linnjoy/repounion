# Windows 上编译、测试并打包 RepoUnion。
name: Windows 打包

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: 测试并打包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 版本与仓库根的 rust-toolchain.toml 保持一致，升级时两处一起改。
      - name: 安装 Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt

      # 缓存 Cargo 注册表和编译产物，缩短重复构建。
      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      # 包含 vue-tsc 类型检查；同时生成 dist，Tauri 编译期 generate_context! 需要它存在。
      - name: 前端类型检查与构建
        run: npm run build

      - name: 检查 Rust 格式
        run: cargo fmt --all --check

      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行核心测试
        run: cargo test -p repounion-core

      # 日常构建只产出安装包。推送 v* 标签时才创建 GitHub Release。
      - name: 打包 Windows 安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          args: --bundles nsis,msi
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: 打包并发布到 GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis,msi
          tagName: ${{ github.ref_name }}
          releaseName: RepoUnion ${{ github.ref_name }}
          releaseBody: Windows 安装包见本 Release 的附件（.msi 与 NSIS .exe）。
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: repounion-windows
          if-no-files-found: error
          # Cargo 工作区把产物放在仓库根的 target，而不是 src-tauri/target。
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
